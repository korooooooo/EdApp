metadata:
  title: 中学社会・初期10語マスター
  purpose: AI問い返し型学習アプリ MVP検証用
  target: 中学2〜3年生
  categories:
  - 公民
  - 歴史
  version: 0.1.0
terms:
- id: term_001
  category: 公民
  name: 三権分立
  reference_text: 国の権力を「立法」「行政」「司法」の3つに分け、それぞれを国会・内閣・裁判所が担当する仕組み。権力が一つに集中すると国民の自由が脅かされるため、互いに抑制し合うことで権力の濫用を防ぐ。
  key_points:
  - 国会(立法)・内閣(行政)・裁判所(司法)の3つに分かれる
  - 権力の集中を防ぐことが目的
  - 互いに抑制し合う関係(チェックアンドバランス)
  - 国民の自由を守るための仕組み
  common_mistakes:
  - 3機関の名前を挙げるだけで「なぜ分けるか」を説明できない
  - 「分けている」という事実だけで仕組みを説明していない
  - 国民や自由との関係を語れない
  - モンテスキューや歴史的背景に触れない
  question_hints:
  - なぜ権力を一つにまとめると問題があるんでしょうか?
  - 3つの機関は具体的にどんな仕事をしていますか?
  - 「抑制し合う」とは、たとえばどんな場面ですか?
  - もし三権分立がなかったら、何が起きるでしょうか?
- id: term_002
  category: 公民
  name: 国民主権
  reference_text: 国の政治を最終的に決定する力(主権)が国民にあるという原則。日本国憲法の三大原則の一つで、選挙によって代表を選ぶこと、重要な決定に国民が関わることで実現される。
  key_points:
  - 主権=国の政治を決める最高の力
  - その主権は国民にある
  - 日本国憲法の三大原則の一つ
  - 選挙・国民投票などで実現される
  common_mistakes:
  - 「国民が決める」とだけ言って、何を決めるかが曖昧
  - 主権という言葉を使えない
  - 天皇主権との対比を説明できない
  - 選挙との関係を語れない
  question_hints:
  - 「主権」というのは、何を決める力のことですか?
  - 昔は誰が主権を持っていましたか?何が変わったんでしょう
  - 国民主権は、具体的にどんな場面で使われていますか?
  - 三大原則の他の2つは何でしたか?
- id: term_003
  category: 公民
  name: 基本的人権
  reference_text: 人が生まれながらに持っている、誰からも侵されない権利。自由権・平等権・社会権・参政権・請求権などがあり、日本国憲法で保障されている。公共の福祉に反しない限り尊重される。
  key_points:
  - 人が生まれながらに持つ権利
  - 誰からも(国家からも)侵されない
  - 自由権・平等権・社会権・参政権・請求権の分類
  - 公共の福祉による制限がある
  common_mistakes:
  - 「人としての権利」と漠然と言うだけ
  - 具体的な権利の種類を挙げられない
  - 「侵すことのできない」という性質を説明できない
  - 公共の福祉との関係を語れない
  question_hints:
  - 「生まれながらに持っている」とはどういう意味ですか?
  - 具体的にはどんな権利が含まれていますか?
  - 権利は無制限に認められるのでしょうか?
  - 自由権と社会権の違いは何ですか?
- id: term_004
  category: 公民
  name: 需要と供給
  reference_text: 需要は買いたい量、供給は売りたい量を表す。市場では需要と供給のバランスで価格が決まり、需要が多ければ価格は上がり、供給が多ければ価格は下がる。両者が釣り合った点を均衡価格という。
  key_points:
  - 需要=買いたい量、供給=売りたい量
  - 価格は需要と供給のバランスで決まる
  - 需要>供給 → 価格上昇
  - 供給>需要 → 価格下落
  - 均衡価格の概念
  common_mistakes:
  - 需要と供給の意味は言えるが、価格との関係を説明できない
  - 具体例を挙げられない
  - 「バランスで決まる」とだけ言って仕組みを語れない
  - グラフや市場との関係を理解していない
  question_hints:
  - スイカが豊作の年と不作の年で、値段はどう変わりますか?
  - なぜ需要が多いと値段が上がるんでしょうか?
  - 需要と供給がぴったり合った時の価格を何といいますか?
  - もし供給だけがどんどん増えたらどうなりますか?
- id: term_005
  category: 公民
  name: 円高・円安
  reference_text: 外国通貨に対する円の価値の変化を表す言葉。1ドル=100円が1ドル=80円になることを円高(円の価値が上がる)、1ドル=120円になることを円安(円の価値が下がる)という。輸出入や経済に大きく影響する。
  key_points:
  - 外国通貨に対する円の価値の変化
  - 円高=円の価値が上がる(数字は小さくなる)
  - 円安=円の価値が下がる(数字は大きくなる)
  - 輸出入への影響(円高は輸入有利、円安は輸出有利)
  common_mistakes:
  - 円高=数字が大きくなる、と逆に覚えている
  - 輸出入への影響を説明できない
  - 「円の価値」という抽象概念を具体化できない
  - 生活への影響を語れない
  question_hints:
  - 1ドル=100円から1ドル=80円になるのは円高?円安?
  - 円高になると、海外旅行は得しますか?損しますか?
  - 円安は日本の輸出企業にとって有利?不利?
  - なぜ「価値が上がる」のに数字は小さくなるんでしょう?
- id: term_006
  category: 歴史
  name: 御恩と奉公
  reference_text: 鎌倉時代の将軍と御家人の主従関係。将軍は御家人に領地を保障・授与する(御恩)、御家人は戦時に出陣し、平時は警備にあたる(奉公)。この双方向の関係が幕府の支配を支えた。
  key_points:
  - 鎌倉時代の将軍と御家人の関係
  - 御恩=将軍が御家人に領地を保障・授与
  - 奉公=御家人が将軍に軍事的に仕える
  - 双方向の関係(片方だけでは成り立たない)
  - 幕府の支配の基礎
  common_mistakes:
  - 御恩と奉公の方向を逆にする
  - 「土地」と「軍事」のキーワードが出ない
  - 双方向の関係であることを説明できない
  - 御家人とは誰かを説明できない
  question_hints:
  - 「御恩」というのは、誰が誰に何を与えたんでしょう?
  - 「奉公」というのは、何をすることでしたか?
  - なぜこの関係が大事だったんでしょうか?
  - もし御恩がもらえなかったら、御家人はどうしたでしょう?
- id: term_007
  category: 歴史
  name: 参勤交代
  reference_text: 江戸時代、徳川幕府が大名を統制するために定めた制度。大名は1年おきに江戸と領地を行き来し、妻子は江戸に住まわせる。移動費用や江戸での生活費が大名の財政を圧迫し、幕府への反乱を防ぐ効果があった。武家諸法度で定められた。
  key_points:
  - 江戸時代の大名統制策
  - 1年おきに江戸と領地を往復
  - 妻子は江戸に常住(人質的意味)
  - 大名の財政を圧迫し反乱を防ぐ
  - 武家諸法度に基づく
  common_mistakes:
  - 「大名が江戸に行く」だけで終わる
  - 財政圧迫という目的を説明できない
  - 妻子の江戸常住に触れない
  - 誰が誰を統制したかが曖昧
  question_hints:
  - 大名はなぜ江戸まで行かなければならなかったんでしょう?
  - 移動には何日もかかります。これによって何が起きましたか?
  - 妻子は江戸に住んでいました。これは何のためですか?
  - 幕府にとって、参勤交代の何が一番のメリットでしたか?
- id: term_008
  category: 歴史
  name: 地租改正
  reference_text: 1873年、明治政府が行った税制改革。土地の所有者(地主)を確定して地券を発行し、地価の3%を現金で納めさせた(後に2.5%に引き下げ)。安定した税収の確保と近代的土地所有制度の確立が目的。
  key_points:
  - 1873年、明治政府による税制改革
  - 米納から金納へ
  - 地券の発行(土地所有者の確定)
  - 地価の3%を現金で納税(後に2.5%)
  - 政府の安定収入確保が目的
  common_mistakes:
  - 「税の改革」とだけ言って、何が変わったか説明できない
  - 米から現金への変更に触れない
  - 「地価の3%」という具体性が出ない
  - 政府の財政安定という目的を語れない
  question_hints:
  - 江戸時代までは何で税を納めていましたか?
  - 地租改正で、納める「もの」はどう変わったんでしょう?
  - なぜ政府はこの改革をしたかったんでしょうか?
  - 農民にとっては良いこと?悪いこと?
- id: term_009
  category: 歴史
  name: 明治維新
  reference_text: 19世紀後半、徳川幕府を倒し、天皇中心の新政府を作って日本を近代国家へ変えた一連の改革。廃藩置県・四民平等・徴兵令・地租改正・学制などを通じて、政治・経済・社会を西洋に倣った仕組みに作り変えた。
  key_points:
  - 江戸幕府を倒し、天皇中心の政府を樹立
  - 中央集権化(廃藩置県)
  - 身分制度の廃止(四民平等)
  - 富国強兵(徴兵令・殖産興業)
  - 西洋に学んだ近代化
  common_mistakes:
  - 「明治時代になったこと」と漠然としている
  - 具体的な改革を挙げられない
  - 「近代化」の中身を説明できない
  - 何のために改革したかを語れない
  question_hints:
  - 明治維新の前と後で、一番大きく変わったことは何ですか?
  - 「近代化」を進めるために、政府は何をしましたか?
  - なぜ西洋のやり方を取り入れたんでしょうか?
  - 「富国強兵」とはどういう意味ですか?
- id: term_010
  category: 歴史
  name: 戦後改革
  reference_text: 第二次世界大戦後、GHQの指導のもとで日本が行った一連の民主化改革。財閥解体・農地改革・労働三法・教育基本法・日本国憲法制定などにより、軍国主義から民主主義国家への転換が進められた。
  key_points:
  - 第二次世界大戦後の民主化改革
  - GHQ(連合国軍総司令部)の指導
  - 財閥解体・農地改革・労働三法
  - 日本国憲法の制定
  - 軍国主義から民主主義への転換
  common_mistakes:
  - 「戦争が終わってから変わったこと」と漠然としている
  - GHQに触れない
  - 具体的な改革を1〜2個しか言えない
  - 何が「民主化」かを説明できない
  question_hints:
  - 誰が中心になってこの改革を進めたんでしょう?
  - 「財閥解体」というのは、何をしたんでしょうか?
  - 農地改革で、農民の生活はどう変わりましたか?
  - 戦前と戦後で、一番大きく変わったことは何だと思いますか?
