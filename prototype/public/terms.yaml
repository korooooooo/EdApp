metadata:
  title: 中学社会・公開前30語マスター
  purpose: AI問い返し型学習アプリ 小規模公開検証用
  target: 中学1〜3年生
  categories:
  - 地理
  - 歴史
  - 公民
  grades:
  - 中1
  - 中2
  - 中3
  version: 0.2.0
terms:
- id: geo_001
  category: 地理
  grade: 中1
  field: 地理
  unit: 世界の姿
  name: 緯度と経度
  reference_text: 緯度は赤道を基準に南北の位置を示し、経度は本初子午線を基準に東西の位置を示す。地球上の場所は緯度と経度の組み合わせで表せる。
  key_points:
  - 緯度は南北の位置を表す
  - 経度は東西の位置を表す
  - 赤道と本初子午線が基準
  - 位置を数字で示せる
  common_mistakes:
  - 緯度と経度の方向を逆にする
  - 赤道と本初子午線の違いが曖昧
  - 地図上の位置と結びつけられない
  question_hints:
  - 緯度は地球のどの方向の位置を表しますか?
  - 経度の基準になる線は何でしたか?
  - なぜ数字で場所を表せると便利なのでしょうか?
- id: geo_002
  category: 地理
  grade: 中1
  field: 地理
  unit: 世界の姿
  name: 時差
  reference_text: 地球が自転しているため、経度が違う地域では時刻に差が生じる。経度15度でおよそ1時間の時差があり、東へ行くほど時刻は進み、西へ行くほど遅れる。
  key_points:
  - 地球の自転によって時差が生まれる
  - 経度15度で約1時間
  - 東へ行くほど時刻は進む
  - 西へ行くほど時刻は遅れる
  common_mistakes:
  - 時差を距離だけで考える
  - 東西で時刻の進み方を逆にする
  - 経度との関係を説明できない
  question_hints:
  - なぜ世界中で同じ時刻にならないのでしょうか?
  - 経度が15度違うと時差はどれくらいですか?
  - 日本からアメリカへ行くと日付が変わることがあるのはなぜですか?
- id: geo_003
  category: 地理
  grade: 中1
  field: 地理
  unit: 世界の気候
  name: 季節風
  reference_text: 季節によって吹く向きが変わる風。大陸と海洋のあたたまり方の違いによって起こり、アジアでは夏に海から湿った風、冬に大陸から乾いた風が吹きやすい。
  key_points:
  - 季節で風向きが変わる
  - 大陸と海洋の温まり方の違いが原因
  - 夏は湿った風が吹きやすい
  - 冬は乾いた風が吹きやすい
  common_mistakes:
  - ただの強い風と考える
  - 夏と冬の風向きを説明できない
  - 雨や気候との関係を語れない
  question_hints:
  - 季節風は何が季節によって変わる風ですか?
  - 夏と冬で風の性質はどう違いますか?
  - 季節風は農業や生活にどんな影響を与えますか?
- id: geo_004
  category: 地理
  grade: 中1
  field: 地理
  unit: 日本の地形
  name: 扇状地
  reference_text: 川が山地から平地に出るところで、運ばれてきた土砂が扇形に積もってできる地形。水はけがよく、果樹園などに利用されることが多い。
  key_points:
  - 山地から平地に出るところにできる
  - 土砂が扇形に積もる
  - 水はけがよい
  - 果樹園に利用されやすい
  common_mistakes:
  - 三角州と混同する
  - どこにできる地形か説明できない
  - 農業利用との関係を語れない
  question_hints:
  - 扇状地は川のどのあたりにできますか?
  - なぜ果樹園に向いているのでしょうか?
  - 三角州とはできる場所がどう違いますか?
- id: geo_005
  category: 地理
  grade: 中1
  field: 地理
  unit: 日本の地形
  name: 三角州
  reference_text: 川が海や湖に流れ込む河口付近で、流れがゆるくなって土砂が積もり、三角形のように広がってできる低く平らな土地。水田や都市に利用される。
  key_points:
  - 河口付近にできる
  - 土砂が積もってできる
  - 低く平らな土地
  - 水田や都市に利用される
  common_mistakes:
  - 扇状地と混同する
  - 川の上流にできると思う
  - 低地の特徴を説明できない
  question_hints:
  - 三角州は川のどのあたりにできますか?
  - なぜ低く平らな土地になりやすいのでしょうか?
  - 扇状地とは利用のされ方がどう違いますか?
- id: geo_006
  category: 地理
  grade: 中1
  field: 地理
  unit: 日本の農業
  name: 促成栽培
  reference_text: 温暖な気候やビニールハウスを利用して、作物をふつうより早い時期に出荷する農業。高知平野などで野菜栽培に見られる。
  key_points:
  - ふつうより早く出荷する
  - 温暖な気候や施設を利用する
  - 高知平野などで盛ん
  - 高い価格で売れる時期をねらう
  common_mistakes:
  - 抑制栽培と混同する
  - 早く出荷する目的を説明できない
  - 気候条件との関係が曖昧
  question_hints:
  - 促成栽培は出荷時期をどうする栽培ですか?
  - なぜ早く出荷すると有利なのでしょうか?
  - どんな地域で行いやすいですか?
- id: geo_007
  category: 地理
  grade: 中1
  field: 地理
  unit: 日本の地域問題
  name: 過疎化
  reference_text: 人口が都市部などへ流出し、地域の人口が減っていくこと。交通・医療・学校・商店などの維持が難しくなり、高齢化と結びついて地域の課題になる。
  key_points:
  - 地域の人口が減る
  - 若い人が都市へ移動しやすい
  - 高齢化と結びつく
  - 生活サービスの維持が難しくなる
  common_mistakes:
  - 人口が少ないことだけを過疎化と考える
  - なぜ問題になるか説明できない
  - 高齢化との関係を語れない
  question_hints:
  - 過疎化は人口がどうなることですか?
  - 人が減ると地域の生活にどんな困りごとが出ますか?
  - なぜ若い人は都市へ移動しやすいのでしょうか?
- id: geo_008
  category: 地理
  grade: 中1
  field: 地理
  unit: 世界の農業
  name: プランテーション
  reference_text: 熱帯地域などで、輸出用の作物を大規模に栽培する農園。コーヒー、カカオ、天然ゴム、バナナなどが栽培され、植民地支配の歴史とも関係が深い。
  key_points:
  - 輸出用作物を大規模に栽培する
  - 熱帯地域に多い
  - コーヒーやカカオなどが代表例
  - 植民地支配の歴史と関係する
  common_mistakes:
  - ただの農園とだけ説明する
  - 輸出用という点が抜ける
  - 作物の具体例が出ない
  question_hints:
  - プランテーションでは何のための作物を作りますか?
  - どんな気候の地域に多いですか?
  - なぜ植民地支配と関係が深いのでしょうか?
- id: geo_009
  category: 地理
  grade: 中1
  field: 地理
  unit: 世界の気候
  name: モンスーン
  reference_text: 季節風のことで、特にアジアの気候に大きな影響を与える。夏には湿った風が雨をもたらし、稲作などの農業と深く関係している。
  key_points:
  - 季節によって向きが変わる風
  - アジアの気候に影響する
  - 夏の湿った風が雨をもたらす
  - 稲作と関係が深い
  common_mistakes:
  - 台風や嵐と混同する
  - 農業との関係を説明できない
  - 季節風とのつながりを忘れる
  question_hints:
  - モンスーンはどんな風のことですか?
  - 夏のモンスーンは農業にどんな影響がありますか?
  - なぜアジアで稲作が盛んなことと関係するのでしょうか?
- id: geo_010
  category: 地理
  grade: 中1
  field: 地理
  unit: 日本の領域
  name: 排他的経済水域
  reference_text: 沿岸国が水産資源や海底資源を利用する権利を持つ海域。領海の外側に広がり、沿岸から200海里まで設定できる。
  key_points:
  - 沿岸国が資源を利用する権利を持つ
  - 沿岸から200海里まで
  - 水産資源や海底資源が関係する
  - 領海とは別の範囲
  common_mistakes:
  - 領海と同じものだと思う
  - 200海里を忘れる
  - 資源利用の権利を説明できない
  question_hints:
  - 排他的経済水域では何を利用する権利がありますか?
  - 領海とは何が違いますか?
  - 日本にとって海の範囲が広いことはなぜ重要ですか?
- id: his_001
  category: 歴史
  grade: 中2
  field: 歴史
  unit: 鎌倉時代
  name: 御恩と奉公
  reference_text: 鎌倉時代の将軍と御家人の主従関係。将軍は御家人に領地を保障・授与し、御家人は戦時に出陣し平時は警備にあたった。
  key_points:
  - 将軍と御家人の関係
  - 御恩は土地の保障や授与
  - 奉公は軍事的な働き
  - 双方向の関係
  common_mistakes:
  - 御恩と奉公の方向を逆にする
  - 土地と軍事の関係が出ない
  - 鎌倉幕府を支えた仕組みだと説明できない
  question_hints:
  - 御恩は誰が誰に何を与えることですか?
  - 奉公では御家人は何をしましたか?
  - なぜこの関係が幕府を支えたのでしょうか?
- id: his_002
  category: 歴史
  grade: 中2
  field: 歴史
  unit: 鎌倉時代
  name: 元寇
  reference_text: 13世紀後半、元が日本に攻めてきたできごと。文永の役と弘安の役があり、御家人の負担が増えたが新しい土地を得にくく、鎌倉幕府の衰えにつながった。
  key_points:
  - 元が日本に攻めてきた
  - 文永の役と弘安の役
  - 御家人の負担が増えた
  - 幕府の衰えにつながった
  common_mistakes:
  - 台風だけで勝ったと単純に考える
  - 御家人への影響を説明できない
  - 幕府の衰えとの関係が抜ける
  question_hints:
  - 元寇で御家人にはどんな負担がありましたか?
  - なぜ戦いの後に不満が残ったのでしょうか?
  - 幕府の支配にどんな影響がありましたか?
- id: his_003
  category: 歴史
  grade: 中2
  field: 歴史
  unit: 室町時代
  name: 楽市・楽座
  reference_text: 織田信長などが行った商工業を活発にする政策。市場の税や座の特権をなくし、商人が自由に商売しやすくした。
  key_points:
  - 商工業を活発にする政策
  - 市場の税をなくす
  - 座の特権をなくす
  - 自由な商売を促す
  common_mistakes:
  - 楽しい市場とだけ覚える
  - 座の意味がわからない
  - 経済を活発にする目的を説明できない
  question_hints:
  - 楽市・楽座は商人にとって何が自由になりましたか?
  - なぜ大名は商売を活発にしたかったのでしょうか?
  - 座の特権をなくすと何が変わりますか?
- id: his_004
  category: 歴史
  grade: 中2
  field: 歴史
  unit: 安土桃山時代
  name: 検地
  reference_text: 豊臣秀吉が全国で行った土地調査。田畑の面積や収穫量を調べて石高で示し、年貢を取る基準にした。
  key_points:
  - 豊臣秀吉の土地調査
  - 田畑の面積や収穫量を調べた
  - 石高で示した
  - 年貢の基準になった
  common_mistakes:
  - ただ土地を測っただけと考える
  - 石高や年貢との関係が出ない
  - 支配を強める目的を説明できない
  question_hints:
  - 検地では土地の何を調べましたか?
  - なぜ収穫量を知る必要があったのでしょうか?
  - 検地は支配にどう役立ちましたか?
- id: his_005
  category: 歴史
  grade: 中2
  field: 歴史
  unit: 江戸時代
  name: 参勤交代
  reference_text: 江戸時代、徳川幕府が大名を統制するために定めた制度。大名は1年おきに江戸と領地を行き来し、妻子は江戸に住まわせた。
  key_points:
  - 大名統制策
  - 江戸と領地を往復
  - 妻子は江戸に住む
  - 大名の財政を圧迫した
  common_mistakes:
  - 大名が江戸に行くことだけで終わる
  - 幕府の目的を説明できない
  - 財政負担に触れない
  question_hints:
  - なぜ大名を江戸に来させたのでしょうか?
  - 移動や江戸での生活にはどんな負担がありましたか?
  - 幕府にとってどんな効果がありましたか?
- id: his_006
  category: 歴史
  grade: 中2
  field: 歴史
  unit: 江戸時代
  name: 鎖国
  reference_text: 江戸幕府がキリスト教の広がりや海外勢力の影響をおさえるため、外国との交流を制限した政策。長崎の出島などを通じて限られた貿易は続いた。
  key_points:
  - 外国との交流を制限した
  - キリスト教の広がりをおさえた
  - 長崎の出島で貿易が続いた
  - 完全に外国と切れたわけではない
  common_mistakes:
  - 外国とまったく関係がなかったと思う
  - 目的をキリスト教以外で説明できない
  - 出島やオランダとの関係を忘れる
  question_hints:
  - 鎖国で幕府は何を制限しましたか?
  - なぜキリスト教を警戒したのでしょうか?
  - 完全に外国と交流がなかったと言えるでしょうか?
- id: his_007
  category: 歴史
  grade: 中2
  field: 歴史
  unit: 明治時代
  name: 地租改正
  reference_text: 1873年に明治政府が行った税制改革。土地所有者に地券を発行し、地価の3%を現金で納めさせて、政府の安定した収入を確保した。
  key_points:
  - 明治政府の税制改革
  - 地券を発行した
  - 地価の3%を現金で納税した
  - 政府の安定収入が目的
  common_mistakes:
  - 税の改革とだけ説明する
  - 米納から金納への変化が出ない
  - 政府の目的を説明できない
  question_hints:
  - 地租改正で税の納め方はどう変わりましたか?
  - なぜ政府は現金で税を集めたかったのでしょうか?
  - 農民にとって負担はどう変わりましたか?
- id: his_008
  category: 歴史
  grade: 中2
  field: 歴史
  unit: 明治時代
  name: 明治維新
  reference_text: 江戸幕府を倒し、天皇中心の新政府を作って日本を近代国家へ変えた一連の改革。廃藩置県、四民平等、徴兵令、地租改正などが進められた。
  key_points:
  - 江戸幕府から明治政府へ変わった
  - 中央集権化を進めた
  - 身分制度を改めた
  - 富国強兵を目指した
  common_mistakes:
  - 明治時代になったことだけと考える
  - 具体的な改革を挙げられない
  - 近代化の目的を説明できない
  question_hints:
  - 明治維新で政治の中心はどう変わりましたか?
  - 近代化のためにどんな改革が行われましたか?
  - なぜ日本は急いで国を強くしようとしたのでしょうか?
- id: his_009
  category: 歴史
  grade: 中2
  field: 歴史
  unit: 近代日本
  name: 日清戦争
  reference_text: 1894年から1895年に日本と清の間で起こった戦争。朝鮮をめぐる対立が背景にあり、日本は勝利して下関条約を結んだ。
  key_points:
  - 日本と清の戦争
  - 朝鮮をめぐる対立が背景
  - 下関条約を結んだ
  - 日本の国際的地位が高まった
  common_mistakes:
  - 日露戦争と混同する
  - 朝鮮をめぐる対立に触れない
  - 条約や結果を説明できない
  question_hints:
  - 日清戦争はどの国どうしの戦争でしたか?
  - 朝鮮はこの戦争とどう関係していましたか?
  - 勝利後、日本は何を得ましたか?
- id: his_010
  category: 歴史
  grade: 中2
  field: 歴史
  unit: 現代日本
  name: 戦後改革
  reference_text: 第二次世界大戦後、GHQの指導のもとで日本が行った民主化改革。日本国憲法制定、農地改革、財閥解体、教育改革などが進められた。
  key_points:
  - 第二次世界大戦後の改革
  - GHQの指導
  - 日本国憲法制定
  - 民主化が目的
  common_mistakes:
  - 戦争後に変わったこととだけ説明する
  - GHQに触れない
  - 具体的な改革を挙げられない
  question_hints:
  - 戦後改革は誰の指導で進められましたか?
  - どんな改革が行われましたか?
  - なぜ民主化が必要だったのでしょうか?
- id: civ_001
  category: 公民
  grade: 中3
  field: 公民
  unit: 日本国憲法
  name: 三権分立
  reference_text: 国の権力を立法、行政、司法の3つに分け、それぞれを国会、内閣、裁判所が担当する仕組み。権力の集中を防ぎ、国民の自由を守るためにある。
  key_points:
  - 立法、行政、司法に分ける
  - 国会、内閣、裁判所が担当する
  - 権力の集中を防ぐ
  - 国民の自由を守る
  common_mistakes:
  - 3つの名前だけで目的を説明しない
  - どの機関が何をするか曖昧
  - 権力を分ける理由が出ない
  question_hints:
  - なぜ権力を3つに分ける必要がありますか?
  - 3つの機関はそれぞれ何を担当しますか?
  - 権力が1つに集まると何が問題ですか?
- id: civ_002
  category: 公民
  grade: 中3
  field: 公民
  unit: 日本国憲法
  name: 国民主権
  reference_text: 国の政治を最終的に決定する力である主権が国民にあるという原則。選挙などを通じて、国民が政治に参加することで実現される。
  key_points:
  - 主権は国の政治を決める最高の力
  - 主権が国民にある
  - 日本国憲法の三大原則
  - 選挙で実現される
  common_mistakes:
  - 国民が偉いという意味だけで考える
  - 主権の意味を説明できない
  - 選挙との関係が出ない
  question_hints:
  - 主権とはどんな力のことですか?
  - 国民はどうやって政治に関わりますか?
  - 明治憲法の考え方とは何が違いますか?
- id: civ_003
  category: 公民
  grade: 中3
  field: 公民
  unit: 日本国憲法
  name: 基本的人権
  reference_text: 人が生まれながらに持つ、誰からも侵されない権利。自由権、平等権、社会権、参政権、請求権などがあり、日本国憲法で保障されている。
  key_points:
  - 人が生まれながらに持つ権利
  - 誰からも侵されない
  - 日本国憲法で保障される
  - さまざまな種類がある
  common_mistakes:
  - 人としての権利とだけ説明する
  - 権利の種類を挙げられない
  - 公共の福祉との関係を忘れる
  question_hints:
  - 基本的人権はいつから持っている権利ですか?
  - 具体的にはどんな権利がありますか?
  - 権利はいつでも無制限に認められますか?
- id: civ_004
  category: 公民
  grade: 中3
  field: 公民
  unit: 日本国憲法
  name: 平和主義
  reference_text: 日本国憲法の三大原則の一つで、戦争を放棄し、戦力を持たず、国際紛争を武力で解決しないという考え方。憲法第9条に示されている。
  key_points:
  - 日本国憲法の三大原則
  - 戦争を放棄する
  - 戦力を持たない
  - 憲法第9条に関係する
  common_mistakes:
  - 戦争しないことだけで終わる
  - 憲法第9条との関係が出ない
  - 三大原則の一つだと説明できない
  question_hints:
  - 平和主義は憲法の何条に関係していますか?
  - 戦争を放棄するとはどういう意味ですか?
  - なぜ戦後の日本でこの考え方が大切になったのでしょうか?
- id: civ_005
  category: 公民
  grade: 中3
  field: 公民
  unit: 地方自治
  name: 地方自治
  reference_text: 住民に身近な地域の政治を、地方公共団体と住民が自分たちで行う仕組み。首長や議員の選挙、条例の制定、住民投票などが関係する。
  key_points:
  - 地域の政治を自分たちで行う
  - 地方公共団体が中心
  - 住民の参加が大切
  - 条例や住民投票が関係する
  common_mistakes:
  - 国の政治との違いを説明できない
  - 住民参加に触れない
  - 地方公共団体の役割が曖昧
  question_hints:
  - 地方自治はどんな範囲の政治を扱いますか?
  - 住民はどうやって地方自治に参加できますか?
  - 国の政治と地方自治は何が違いますか?
- id: civ_006
  category: 公民
  grade: 中3
  field: 公民
  unit: 経済
  name: 需要と供給
  reference_text: 需要は買いたい量、供給は売りたい量を表す。市場では需要と供給のバランスで価格が決まり、需要が多ければ価格は上がり、供給が多ければ価格は下がる。
  key_points:
  - 需要は買いたい量
  - 供給は売りたい量
  - 価格はバランスで決まる
  - 需要が多いと価格が上がりやすい
  common_mistakes:
  - 需要と供給の意味だけで終わる
  - 価格との関係を説明できない
  - 具体例を挙げられない
  question_hints:
  - 需要が増えると価格はどうなりやすいですか?
  - 供給が増えすぎると価格はどうなりますか?
  - 身近な商品で例を考えるとどうなりますか?
- id: civ_007
  category: 公民
  grade: 中3
  field: 公民
  unit: 経済
  name: 円高・円安
  reference_text: 外国通貨に対する円の価値の変化を表す言葉。円高は円の価値が上がること、円安は円の価値が下がることで、輸出入や生活に影響する。
  key_points:
  - 外国通貨に対する円の価値
  - 円高は円の価値が上がる
  - 円安は円の価値が下がる
  - 輸出入に影響する
  common_mistakes:
  - 数字の大小だけで判断して逆に覚える
  - 輸出入への影響を説明できない
  - 生活への影響を考えられない
  question_hints:
  - 円高になると輸入品は買いやすくなりますか?
  - 円安は輸出企業にとって有利でしょうか?
  - なぜ円の価値と数字の大きさが逆に見えるのでしょうか?
- id: civ_008
  category: 公民
  grade: 中3
  field: 公民
  unit: 財政
  name: 累進課税
  reference_text: 所得が多い人ほど高い税率で税を負担する仕組み。所得税などに用いられ、税負担の公平や所得格差の調整に関係する。
  key_points:
  - 所得が多いほど税率が高い
  - 所得税に用いられる
  - 税負担の公平を目指す
  - 所得格差の調整に関係する
  common_mistakes:
  - 税金が増えることだけで説明する
  - 税率と税額の違いが曖昧
  - 公平との関係を語れない
  question_hints:
  - 累進課税では所得が多い人の税率はどうなりますか?
  - なぜ同じ税率ではなく差をつけるのでしょうか?
  - 公平という考え方とどう関係しますか?
- id: civ_009
  category: 公民
  grade: 中3
  field: 公民
  unit: 社会保障
  name: 社会保障
  reference_text: 病気、失業、高齢、介護などで生活が不安定になったときに、国や社会が人々の生活を支える制度。年金、医療保険、介護保険、生活保護などが含まれる。
  key_points:
  - 生活の不安を社会全体で支える
  - 年金や医療保険が含まれる
  - 高齢化と関係が深い
  - 税や保険料で支えられる
  common_mistakes:
  - 困った人を助けるだけで終わる
  - 制度の具体例を挙げられない
  - 費用を誰が負担するか説明できない
  question_hints:
  - 社会保障にはどんな制度がありますか?
  - なぜ社会全体で支える必要があるのでしょうか?
  - 少子高齢化とどんな関係がありますか?
- id: civ_010
  category: 公民
  grade: 中3
  field: 公民
  unit: 政治参加
  name: 選挙
  reference_text: 国民や住民が代表者を選ぶ仕組み。民主政治を支える重要な方法で、普通選挙、平等選挙、直接選挙、秘密選挙などの原則がある。
  key_points:
  - 代表者を選ぶ仕組み
  - 民主政治を支える
  - 選挙の原則がある
  - 政治参加の方法
  common_mistakes:
  - 投票することだけで説明する
  - 民主政治との関係が出ない
  - 選挙の原則を挙げられない
  question_hints:
  - 選挙は誰を選ぶための仕組みですか?
  - なぜ民主政治に選挙が必要なのでしょうか?
  - 選挙の原則にはどんなものがありますか?
